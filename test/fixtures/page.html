<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eye fixture</title>
<style>
  body { font: 14px system-ui; margin: 20px; }
  #box { width: 80px; height: 80px; background: #36c; transition: transform 0.3s ease-out; }
  #box.moved { transform: translateX(200px); }
  #banner { height: 60px; background: #fc3; }
  #cover { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.1); display: none; }
</style>
</head>
<body>
  <div id="slot"></div>
  <button id="move">Move the box</button>
  <button id="block">Block</button>
  <button id="boom">Break</button>
  <button id="off" disabled>Disabled one</button>
  <label for="name">Your name</label> <input id="name" type="text">
  <div id="box"></div>
  <div id="cover"></div>
<script>
  document.getElementById("move").onclick = () => document.getElementById("box").classList.toggle("moved");
  function blockMainThread() {
    const until = performance.now() + 200;
    while (performance.now() < until) { /* busy */ }
  }
  document.getElementById("block").addEventListener("click", blockMainThread);
  document.getElementById("boom").onclick = () => { console.error("fixture went wrong"); throw new Error("fixture exploded"); };
  // A late banner pushes everything down: a layout shift nobody asked for.
  setTimeout(() => { const b = document.createElement("div"); b.id = "banner"; b.textContent = "late banner"; document.getElementById("slot").appendChild(b); }, 1200);
</script>
</body>
</html>
